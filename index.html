<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skin Care Essentials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <section class="hero">

        <div class="hero__title">
            <span class="hero__eyebrow">The New</span>
            <h1 class="hero__heading">Skin Care</h1>
            <span class="hero__spark">✦</span>
            <span class="hero__subheading">Essentials</span>
        </div>


        <div class="hero__img hero__img--small-top">
            <img src="left.jpg" alt="Portrait modèle skincare" />
        </div>


        <div class="hero__img hero__img--main">
            <img src="middle.jpg" alt="Modèle tenant un pot de crème" />
        </div>

        <span class="hero__spark hero__spark--left">✦</span>
        <span class="hero__spark hero__spark--right">✦</span>

        <a href="#reviews" class="hero__reviews">Watch reviews</a>

        <div class="hero__img hero__img--small-bottom">
            <img src="right.jpg" alt="Modèle appliquant de la crème" />
        </div>

        <button class="hero__cta">Shop now</button>

        <div class="hero__card">
            <p class="hero__card-title">Hey. Hi. Hello</p>
            <p class="hero__card-subtitle">We're Skeen your skin protector</p>
            <p class="hero__card-cta">
                Make appoint<br />ment
                <span class="hero__card-arrow">↗</span>
            </p>
        </div>

        <img class="hero__flower hero__flower--1" src="assets/sunflower.png" alt="" />
        <img class="hero__flower hero__flower--2" src="assets/sunflower.png" alt="" />
        <img class="hero__flower hero__flower--3" src="assets/sunflower.png" alt="" />

    </section>

</body>

</html>
